[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronesw"
version = "0.1.0"
description = "Inspección agro autónoma con PX4: misión, visión y reportes."
requires-python = ">=3.10"
dependencies = [
    "mavsdk>=2.6.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0",
    "pystac-client>=0.8.0",
    "rasterio>=1.3.0",
    "numpy>=1.24",
    "matplotlib>=3.9",
    "pillow>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts"]

[tool.ruff.lint]
# Declaradas explícitamente: el conjunto por defecto de ruff cambia entre versiones,
# y eso hace que la misma línea pase en una máquina y falle en otra.
select = ["E", "F", "I", "UP", "B", "DTZ", "RUF"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]