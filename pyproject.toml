[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronesw"
version = "0.1.0"
description = "Inspección agro autónoma con PX4: misión, visión y reportes."
requires-python = ">=3.10"
dependencies = [
    "mavsdk>=2.6.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]